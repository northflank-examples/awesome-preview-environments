{{- /* Keep the generated password stable across upgrades of the same preview. */ -}}
{{- $password := randAlphaNum 24 -}}
{{- with (lookup "v1" "Secret" .Release.Namespace "preview-db") }}
{{- $password = index .data "password" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: preview-db
type: Opaque
stringData:
  password: {{ $password | quote }}
  url: {{ printf "postgres://%s:%s@postgres:5432/%s" .Values.postgres.user $password .Values.postgres.database | quote }}
---
# Throwaway database: data lives in an emptyDir and disappears with the preview.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: preview-db, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}] }
            periodSeconds: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
