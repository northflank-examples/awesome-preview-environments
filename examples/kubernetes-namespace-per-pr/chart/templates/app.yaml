apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      {{- with .Values.app.migrateCommand }}
      initContainers:
        - name: migrate
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          command: {{- toYaml . | nindent 12 }}
          # The namespace ResourceQuota rejects any container (init containers included) without limits.
          resources: {{- toYaml $.Values.app.resources | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: preview-db, key: url } }
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ containerPort: {{ .Values.app.port }} }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: preview-db, key: url } }
            - { name: PORT, value: {{ .Values.app.port | quote }} }
            - { name: PUBLIC_URL, value: {{ printf "https://%s" .Values.host | quote }} }
          readinessProbe:
            tcpSocket: { port: {{ .Values.app.port }} }
            periodSeconds: 5
          resources: {{- toYaml .Values.app.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector: { app: app }
  ports: [{ port: 80, targetPort: {{ .Values.app.port }} }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $.Values.host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: app, port: { number: 80 } }
